<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>悬赏终端 · Bounty Terminal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --hue:220;
  --bg-a:hsl(var(--hue),46%,9%);
  --bg-b:hsl(calc(var(--hue) + 42),40%,14%);
  --bg-c:hsl(calc(var(--hue) - 30),38%,7%);
  --ink:hsl(var(--hue),26%,93%);
  --ink-dim:hsla(var(--hue),24%,80%,.62);
  --line:hsla(var(--hue),62%,74%,.16);
  --line-str:hsla(var(--hue),70%,80%,.30);
  --glass:hsla(var(--hue),54%,30%,.30);
  --glass-hi:hsla(var(--hue),60%,42%,.20);
  --accent:hsl(var(--hue),88%,68%);
  --accent-2:hsl(calc(var(--hue) + 34),90%,66%);
  --gold:hsl(42,94%,62%);
  --danger:hsl(4,90%,66%);
  --ok:hsl(152,74%,58%);
  --r:18px;
}
html,body{height:100%}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 780px at 12% -8%, hsl(calc(var(--hue) + 26),60%,26%) 0%, transparent 62%),
    radial-gradient(900px 700px at 92% 6%, hsl(calc(var(--hue) - 34),58%,22%) 0%, transparent 58%),
    radial-gradient(800px 900px at 50% 112%, hsl(calc(var(--hue) + 60),52%,20%) 0%, transparent 62%),
    linear-gradient(168deg, var(--bg-a), var(--bg-c) 58%, var(--bg-b));
  background-attachment:fixed;
  min-height:100vh;
  padding:26px clamp(14px,3vw,40px) 56px;
  transition:background .5s ease;
  -webkit-font-smoothing:antialiased;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(1px 1px at 22% 18%,hsla(var(--hue),90%,90%,.34),transparent),
                   radial-gradient(1px 1px at 74% 32%,hsla(var(--hue),90%,90%,.22),transparent),
                   radial-gradient(1px 1px at 41% 74%,hsla(var(--hue),90%,90%,.26),transparent),
                   radial-gradient(1px 1px at 86% 82%,hsla(var(--hue),90%,90%,.18),transparent);
  opacity:.7;
}
.wrap{max-width:1240px;margin:0 auto;position:relative;z-index:1}

/* ───────── 顶栏 ───────── */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:11px}
.logo{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 22px hsla(var(--hue),90%,58%,.42), inset 0 1px 0 hsla(0,0%,100%,.35);
  display:grid;place-items:center;font-size:19px;
}
h1{font-size:19px;font-weight:650;letter-spacing:.4px}
h1 small{display:block;font-size:10.5px;font-weight:400;color:var(--ink-dim);letter-spacing:1.6px;margin-top:1px}
.sp{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:999px;font-size:11.5px;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  color:var(--ink-dim);white-space:nowrap;
}
.chip b{color:var(--ink);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok);flex:none}
.dot.bad{background:var(--danger);box-shadow:0 0 9px var(--danger)}

/* ───────── 玻璃卡 ───────── */
.glass{
  position:relative;border-radius:var(--r);
  background:linear-gradient(158deg,var(--glass),var(--glass-hi));
  border:1px solid var(--line);
  box-shadow:0 18px 48px hsla(var(--hue),70%,4%,.42), inset 0 1px 0 hsla(0,0%,100%,.10);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  padding:20px 22px;
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(150deg,hsla(0,0%,100%,.08),transparent 42%);
}
.sec-title{
  display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-dim);margin-bottom:15px;
}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* ───────── 布局 ───────── */
.grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}

/* ───────── 当前悬赏 ───────── */
.bounty{position:relative;overflow:hidden}
.bounty.glow::after{
  content:"";position:absolute;inset:-40% -10% auto -10%;height:220px;pointer-events:none;
  background:radial-gradient(closest-side,hsla(var(--hue),92%,66%,.22),transparent);
  animation:breathe 3.6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.bn-head{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.badge{
  font-size:10.5px;font-weight:700;letter-spacing:1.2px;padding:4px 10px;border-radius:999px;
  border:1px solid transparent;white-space:nowrap;
}
.badge.waiting{background:hsla(42,92%,58%,.16);color:var(--gold);border-color:hsla(42,92%,58%,.36)}
.badge.open{background:hsla(152,74%,52%,.16);color:var(--ok);border-color:hsla(152,74%,52%,.40);animation:pulse 1.5s infinite}
.badge.won{background:hsla(var(--hue),80%,66%,.16);color:var(--accent);border-color:hsla(var(--hue),80%,66%,.36)}
.badge.none{background:hsla(0,0%,50%,.14);color:var(--ink-dim);border-color:var(--line)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 hsla(152,74%,52%,.42)}50%{box-shadow:0 0 0 7px hsla(152,74%,52%,0)}}
.bn-points{
  margin-left:auto;font-variant-numeric:tabular-nums;font-weight:750;font-size:17px;color:var(--gold);
  text-shadow:0 0 18px hsla(42,92%,58%,.45);
}
.bn-points span{font-size:10.5px;font-weight:500;color:var(--ink-dim);margin-left:3px}
.bn-text{
  font-size:clamp(17px,2.4vw,23px);font-weight:640;line-height:1.42;letter-spacing:.2px;
  margin-bottom:16px;word-break:break-word;
}
.bn-text.empty{color:var(--ink-dim);font-weight:400;font-size:15px}
.bn-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.bn-meta .chip{font-size:11px;padding:5px 10px}
.countdown{
  font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.5px;
  color:var(--gold);font-size:12.5px;
}
.countdown.ready{color:var(--ok)}

/* 抢单区 */
.grab{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding-top:15px;border-top:1px solid var(--line)}
input[type=text],input[type=number],input[type=time],select{
  font:inherit;font-size:13px;color:var(--ink);
  background:hsla(var(--hue),46%,16%,.55);
  border:1px solid var(--line);border-radius:11px;
  padding:9px 12px;outline:none;transition:.2s;
  backdrop-filter:blur(8px);
}
input::placeholder{color:hsla(var(--hue),20%,72%,.42)}
input:focus,select:focus{border-color:var(--line-str);box-shadow:0 0 0 3px hsla(var(--hue),88%,68%,.14)}
input[type=time]{font-variant-numeric:tabular-nums}
.btn{
  font:inherit;font-size:13px;font-weight:640;cursor:pointer;
  padding:9px 18px;border-radius:11px;border:1px solid transparent;
  transition:transform .14s ease,box-shadow .2s ease,filter .2s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn-primary{
  color:hsl(var(--hue),70%,10%);
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 24px hsla(var(--hue),90%,58%,.36), inset 0 1px 0 hsla(0,0%,100%,.4);
}
.btn-primary:not(:disabled):hover{filter:brightness(1.08);box-shadow:0 10px 30px hsla(var(--hue),90%,58%,.5)}
.btn-gold{
  color:hsl(42,90%,12%);
  background:linear-gradient(145deg,hsl(46,96%,66%),hsl(34,94%,58%));
  box-shadow:0 8px 24px hsla(42,92%,58%,.42), inset 0 1px 0 hsla(0,0%,100%,.45);
}
.btn-gold:not(:disabled):hover{filter:brightness(1.07)}
.btn-ghost{
  color:var(--ink);background:hsla(var(--hue),50%,24%,.44);border-color:var(--line);
  backdrop-filter:blur(10px);
}
.btn-ghost:not(:disabled):hover{background:hsla(var(--hue),50%,30%,.58);border-color:var(--line-str)}
.btn-danger{color:var(--danger);background:hsla(4,80%,50%,.12);border-color:hsla(4,80%,60%,.32)}
.btn-danger:not(:disabled):hover{background:hsla(4,80%,50%,.2)}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:9px}

/* ───────── 排行榜 ───────── */
.rank{display:flex;flex-direction:column;gap:7px}
.rk{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:12px;
  background:hsla(var(--hue),50%,22%,.30);
  border:1px solid transparent;transition:.22s;
}
.rk:hover{background:hsla(var(--hue),54%,28%,.42);border-color:var(--line)}
.rk.top1{
  background:linear-gradient(100deg,hsla(42,92%,58%,.20),hsla(42,92%,58%,.05));
  border-color:hsla(42,92%,58%,.36);
}
.rk.top2{background:linear-gradient(100deg,hsla(0,0%,88%,.12),transparent);border-color:hsla(0,0%,88%,.24)}
.rk.top3{background:linear-gradient(100deg,hsla(28,80%,56%,.13),transparent);border-color:hsla(28,80%,56%,.26)}
.rk-no{
  width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:8px;
  font-size:11.5px;font-weight:750;font-variant-numeric:tabular-nums;
  background:hsla(var(--hue),46%,30%,.5);color:var(--ink-dim);
}
.rk.top1 .rk-no{background:linear-gradient(145deg,hsl(46,96%,64%),hsl(36,92%,54%));color:hsl(42,90%,12%)}
.rk.top2 .rk-no{background:hsla(0,0%,86%,.85);color:hsl(220,20%,18%)}
.rk.top3 .rk-no{background:linear-gradient(145deg,hsl(30,84%,60%),hsl(24,80%,48%));color:hsl(26,80%,12%)}
.rk-name{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-stat{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums;flex:none}
.rk-cnt{font-size:15px;font-weight:750;color:var(--accent)}
.rk-cnt small{font-size:10px;font-weight:500;color:var(--ink-dim);margin-left:1px}
.rk-pts{font-size:11.5px;color:var(--gold);margin-left:7px}
.empty-hint{padding:26px 8px;text-align:center;color:var(--ink-dim);font-size:12.5px;line-height:1.7}

/* 猎人墙 */
.wall{display:flex;flex-wrap:wrap;gap:7px}
.hunter{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:999px;font-size:11.5px;
  background:hsla(var(--hue),50%,26%,.40);border:1px solid var(--line);
}
.hunter.crown{background:linear-gradient(100deg,hsla(42,92%,58%,.26),hsla(42,92%,58%,.06));border-color:hsla(42,92%,58%,.42);color:var(--gold)}
.hunter.idle{opacity:.44}

/* ───────── 发布表单 ───────── */
.form{display:grid;gap:12px}
.field{display:grid;gap:6px}
.field label{font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-dim)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.form-actions{display:flex;gap:9px;flex-wrap:wrap;padding-top:3px}

/* ───────── 历史战绩 ───────── */
.log{display:flex;flex-direction:column;gap:5px;max-height:290px;overflow-y:auto;padding-right:4px}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:hsla(var(--hue),60%,66%,.24);border-radius:99px}
.log::-webkit-scrollbar-thumb:hover{background:hsla(var(--hue),60%,66%,.42)}
.logitem{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;font-size:12px;background:hsla(var(--hue),46%,20%,.24)}
.logitem:hover{background:hsla(var(--hue),46%,26%,.38)}
.logitem .t{font-variant-numeric:tabular-nums;color:var(--ink-dim);font-size:10.5px;flex:none;width:52px}
.logitem .w{font-weight:650;color:var(--gold);flex:none}
.logitem .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-dim)}
.logitem .p{font-variant-numeric:tabular-nums;color:var(--accent);flex:none;font-weight:600}

/* ───────── 主题 ───────── */
.themes{display:flex;gap:6px;align-items:center}
.swatch{
  width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:.2s;flex:none;
}
.swatch:hover{transform:scale(1.16)}
.swatch.on{border-color:hsla(0,0%,100%,.92);box-shadow:0 0 0 2px hsla(var(--hue),70%,50%,.5)}

/* ───────── Toast ───────── */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:99;max-width:min(360px,86vw)}
.toast{
  padding:11px 15px;border-radius:12px;font-size:12.5px;line-height:1.5;
  background:hsla(var(--hue),48%,20%,.88);border:1px solid var(--line-str);
  box-shadow:0 14px 38px hsla(var(--hue),80%,4%,.55);
  backdrop-filter:blur(18px) saturate(150%);
  animation:slideIn .26s cubic-bezier(.2,.9,.3,1.3);
}
.toast.ok{border-color:hsla(152,74%,52%,.5);box-shadow:0 14px 38px hsla(152,74%,40%,.28)}
.toast.err{border-color:hsla(4,90%,62%,.5);box-shadow:0 14px 38px hsla(4,90%,50%,.28)}
@keyframes slideIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
.fade{animation:fadeOut .3s forwards}
@keyframes fadeOut{to{opacity:0;transform:translateY(8px)}}

.foot{margin-top:26px;text-align:center;font-size:11px;color:hsla(var(--hue),20%,76%,.36);letter-spacing:.6px}
.foot a{color:hsla(var(--hue),60%,74%,.6);text-decoration:none}
.foot a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="logo">🏅</div>
      <h1>悬赏终端<small>BOUNTY TERMINAL</small></h1>
    </div>
    <div class="sp"></div>
    <div class="themes" id="themes"></div>
    <span class="chip" id="status"><span class="dot"></span><b>连接中</b></span>
  </div>

  <div class="grid">
    <div class="col">

      <!-- 当前悬赏 -->
      <div class="glass bounty" id="bountyCard">
        <div class="sec-title">当前悬赏</div>
        <div class="bn-head">
          <span class="badge none" id="bnBadge">无</span>
          <span class="countdown" id="bnCount"></span>
          <div class="bn-points" id="bnPoints"></div>
        </div>
        <div class="bn-text empty" id="bnText">正在读取…</div>
        <div class="bn-meta" id="bnMeta"></div>
        <div class="grab">
          <input type="text" id="grabWho" placeholder="你的身份（抢单署名）" style="flex:1;min-width:150px" maxlength="24">
          <button class="btn btn-gold" id="btnGrab">⚡ 抢单</button>
        </div>
      </div>

      <!-- 发布悬赏 -->
      <div class="glass">
        <div class="sec-title">发布悬赏</div>
        <div class="form">
          <div class="field">
            <label for="pubText">悬赏内容</label>
            <input type="text" id="pubText" placeholder="要悬赏什么？例如：把这套 UI 改到能跑" maxlength="200">
          </div>
          <div class="row2">
            <div class="field">
              <label for="pubPoints">积分</label>
              <input type="number" id="pubPoints" placeholder="50" min="1" max="99999" value="50">
            </div>
            <div class="field">
              <label for="pubTime">开放时刻</label>
              <input type="time" id="pubTime">
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" id="btnPublish">📢 发布</button>
            <button class="btn btn-danger" id="btnClear">撤下</button>
          </div>
        </div>
      </div>

    </div>
    <div class="col">

      <!-- 排行榜 -->
      <div class="glass">
        <div class="sec-title">抢单排行榜</div>
        <div class="rank" id="rank"><div class="empty-hint">还没有战绩</div></div>
      </div>

      <!-- 猎人墙 -->
      <div class="glass">
        <div class="sec-title">赏金猎人墙</div>
        <div class="wall" id="wall"><div class="empty-hint">虚位以待</div></div>
      </div>

      <!-- 战绩 -->
      <div class="glass">
        <div class="sec-title">历史战绩</div>
        <div class="log" id="log"><div class="empty-hint">暂无记录</div></div>
      </div>

    </div>
  </div>

  <div class="foot">悬赏终端 · <a href="#" id="wbLink">工作台镜像</a> · Bear-St-w</div>
</div>
<div class="toasts" id="toasts"></div>

<script>
(function(){
  'use strict';

  var THEMES = [
    { id:'aurora',  hue:220, dot:'hsl(220,88%,68%)' },
    { id:'emerald', hue:152, dot:'hsl(152,74%,58%)' },
    { id:'sunset',  hue:16,  dot:'hsl(16,88%,64%)' },
    { id:'orchid',  hue:276, dot:'hsl(276,80%,70%)' },
    { id:'ocean',   hue:195, dot:'hsl(195,84%,62%)' },
    { id:'rose',    hue:340, dot:'hsl(340,84%,68%)' }
  ];
  var $ = function(id){ return document.getElementById(id); };

  // ── 状态 ──
  var S = { bounty:null, log:[], meta:null, tick:0 };

  // ── 主题 ──
  function applyTheme(id){
    var t = THEMES.filter(function(x){ return x.id===id; })[0] || THEMES[0];
    document.documentElement.style.setProperty('--hue', t.hue);
    try { localStorage.setItem('xs.theme', t.id); } catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll('.swatch'), function(el){
      el.classList.toggle('on', el.dataset.theme === t.id);
    });
  }
  (function buildThemes(){
    var box = $('themes');
    THEMES.forEach(function(t){
      var s = document.createElement('div');
      s.className = 'swatch';
      s.dataset.theme = t.id;
      s.title = t.id;
      s.style.background = 'linear-gradient(145deg,' + t.dot + ',hsla(' + t.hue + ',70%,28%,.9))';
      s.onclick = function(){ applyTheme(t.id); };
      box.appendChild(s);
    });
    var saved = null;
    try { saved = localStorage.getItem('xs.theme'); } catch(e){}
    applyTheme(saved || 'aurora');
  })();

  // ── 身份记忆 ──
  try {
    var w = localStorage.getItem('xs.who');
    if (w) $('grabWho').value = w;
  } catch(e){}
  $('grabWho').addEventListener('change', function(){
    try { localStorage.setItem('xs.who', this.value.trim()); } catch(e){}
  });

  // ── Toast ──
  function toast(msg, kind){
    var el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(function(){
      el.classList.add('fade');
      setTimeout(function(){ el.remove(); }, 320);
    }, 2600);
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function pad(n){ return (n<10?'0':'') + n; }

  // ── 网络 ──
  function api(path, opt){
    return fetch(path, opt).then(function(r){
      return r.json().catch(function(){ return { ok:false, error:'响应不是 JSON' }; });
    }).catch(function(e){
      return { ok:false, error:'连不上本地服务：' + e.message };
    });
  }
  function setStatus(ok, text){
    var s = $('status');
    s.innerHTML = '<span class="dot' + (ok?'':' bad') + '"></span><b>' + esc(text) + '</b>';
  }

  // ── 渲染：状态徽标 ──
  function badgeOf(b){
    if (!b) return { cls:'none', txt:'无悬赏' };
    if (b.status === 'won') return { cls:'won', txt:'已被抢到' };
    if (b.status === 'open') return { cls:'open', txt:'开放中' };
    return { cls:'waiting', txt:'未开放' };
  }

  function renderBounty(){
    var b = S.bounty;
    var card = $('bountyCard');
    var bg = badgeOf(b);
    $('bnBadge').className = 'badge ' + bg.cls;
    $('bnBadge').textContent = bg.txt;
    $('bnText').textContent = b ? b.text : '现在没有悬赏 —— 去下面发布一条';
    $('bnText').className = 'bn-text' + (b ? '' : ' empty');
    $('bnPoints').innerHTML = b ? (b.points + '<span>分</span>') : '';

    var meta = [];
    if (b) {
      if (b.open_hhmm) meta.push('开放 ' + b.open_hhmm);
      if (b.created) meta.push('发布 ' + b.created);
      if (b.winner) meta.push('🏅 ' + b.winner + ' · ' + (b.win_hhmm || ''));
      if (b.win_ms) meta.push('滞后 ' + b.win_ms + ' ms');
    }
    $('bnMeta').innerHTML = meta.map(function(m){
      return '<span class="chip">' + esc(m) + '</span>';
    }).join('');

    card.classList.toggle('glow', !!b && b.status === 'open');
    $('btnGrab').disabled = !b || b.status !== 'open';
    $('btnClear').disabled = !b;
    renderCountdown();
  }

  function renderCountdown(){
    var b = S.bounty, el = $('bnCount');
    if (!b) { el.textContent = ''; el.className = 'countdown'; return; }
    if (b.status === 'won') { el.textContent = ''; el.className = 'countdown'; return; }
    if (b.status === 'open') { el.textContent = '● 可以抢了'; el.className = 'countdown ready'; return; }
    var left = Math.max(0, Math.round((b.open_ts || 0) - (Date.now()/1000 + S.skew)));
    if (left <= 0) { el.textContent = '● 即将开放'; el.className = 'countdown ready'; return; }
    var h = Math.floor(left/3600), m = Math.floor(left%3600/60), s = left%60;
    el.textContent = '倒计时 ' + (h>0 ? h + ':' : '') + pad(m) + ':' + pad(s);
    el.className = 'countdown';
  }

  // ── 渲染：排行榜（按次数，次数同看总分）──
  function renderRank(){
    var agg = {};
    (S.log || []).forEach(function(r){
      if (r.act !== '抢到' || !r.who) return;
      var k = r.who;
      if (!agg[k]) agg[k] = { who:k, cnt:0, pts:0 };
      agg[k].cnt += 1;
      agg[k].pts += Number(r.points) || 0;
    });
    var list = Object.keys(agg).map(function(k){ return agg[k]; })
      .sort(function(a,b){ return b.cnt - a.cnt || b.pts - a.pts; });

    if (!list.length) {
      $('rank').innerHTML = '<div class="empty-hint">还没有战绩 —— 到点后第一个抢到的人上榜</div>';
      return;
    }
    $('rank').innerHTML = list.map(function(x, i){
      var cls = 'rk' + (i===0?' top1':i===1?' top2':i===2?' top3':'');
      return '<div class="' + cls + '">' +
        '<div class="rk-no">' + (i===0?'👑':(i+1)) + '</div>' +
        '<div class="rk-name">' + esc(x.who) + '</div>' +
        '<div class="rk-stat"><span class="rk-cnt">' + x.cnt + '<small>次</small></span>' +
        '<span class="rk-pts">' + x.pts + ' 分</span></div>' +
      '</div>';
    }).join('');
  }

  // ── 渲染：猎人墙 ──
  function renderWall(){
    var agg = {};
    (S.log || []).forEach(function(r){
      if (r.act !== '抢到' || !r.who) return;
      agg[r.who] = (agg[r.who] || 0) + 1;
    });
    var names = Object.keys(agg).sort(function(a,b){ return agg[b] - agg[a]; });
    if (!names.length) {
      $('wall').innerHTML = '<div class="empty-hint">虚位以待 —— 抢到过的都会上墙</div>';
      return;
    }
    $('wall').innerHTML = names.map(function(n, i){
      return '<span class="hunter' + (i===0?' crown':'') + '">' +
        (i===0?'👑 ':'') + esc(n) + ' · ' + agg[n] + '</span>';
    }).join('');
  }

  // ── 渲染：战绩 ──
  function renderLog(){
    var rows = (S.log || []).slice(-40).reverse();
    if (!rows.length) {
      $('log').innerHTML = '<div class="empty-hint">暂无记录</div>';
      return;
    }
    $('log').innerHTML = rows.map(function(r){
      return '<div class="logitem">' +
        '<span class="t">' + esc(r.hhmm || '') + '</span>' +
        '<span class="w">' + esc(r.who || '') + '</span>' +
        '<span class="x">' + esc(r.text || r.act || '') + '</span>' +
        '<span class="p">' + (Number(r.points)||0) + '</span>' +
      '</div>';
    }).join('');
  }

  function renderAll(){
    renderBounty();
    renderRank();
    renderWall();
    renderLog();
  }

  // ── 拉数据 ──
  function refresh(silent){
    return api('/api/bounty').then(function(j){
      if (j && j.ok) {
        S.bounty = j.bounty || null;
        S.log = j.log || [];
        if (typeof j.now === 'number') {
          S.skew = j.now - Date.now()/1000;
        }
        setStatus(true, '已连接');
        renderAll();
      } else {
        setStatus(false, '工作台未响应');
        if (!silent) toast((j && (j.error || j.err)) || '读取失败', 'err');
        $('bnText').textContent = '读取失败：' + ((j && (j.error || j.err)) || '未知错误');
        $('bnText').className = 'bn-text empty';
      }
    });
  }

  // ── 抢单 ──
  $('btnGrab').onclick = function(){
    var who = $('grabWho').value.trim();
    if (!who) { toast('先填你的身份', 'err'); $('grabWho').focus(); return; }
    try { localStorage.setItem('xs.who', who); } catch(e){}
    var btn = this;
    btn.disabled = true;
    btn.textContent = '抢单中…';
    api('/api/grab', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ who: who })
    }).then(function(j){
      if (j && j.ok) {
        toast('🏅 抢到了！' + (j.win_ms != null ? '（开放后 ' + j.win_ms + ' ms）' : ''), 'ok');
      } else {
        toast((j && (j.error || j.err)) || '没抢到', 'err');
      }
      return refresh(true);
    }).finally(function(){
      btn.textContent = '⚡ 抢单';
      renderBounty();
    });
  };

  // ── 发布 ──
  $('btnPublish').onclick = function(){
    var text = $('pubText').value.trim();
    if (!text) { toast('悬赏得写点什么', 'err'); $('pubText').focus(); return; }
    var pts = parseInt($('pubPoints').value, 10);
    if (!isFinite(pts) || pts <= 0) { toast('积分得是正数', 'err'); return; }
    var hhmm = $('pubTime').value || '';
    var btn = this;
    btn.disabled = true;
    api('/api/bounty', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ act:'set', text:text, points:pts, open_hhmm:hhmm })
    }).then(function(j){
      if (j && j.ok) {
        toast('悬赏已发布', 'ok');
        $('pubText').value = '';
      } else {
        toast((j && (j.error || j.err)) || '发布失败', 'err');
      }
      return refresh(true);
    }).finally(function(){ btn.disabled = false; });
  };

  // ── 撤下 ──
  $('btnClear').onclick = function(){
    if (!confirm('确定撤下当前悬赏？')) return;
    var btn = this;
    btn.disabled = true;
    api('/api/bounty', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ act:'clear' })
    }).then(function(j){
      if (j && j.ok) toast('已撤下', 'ok');
      else toast((j && (j.error || j.err)) || '撤下失败', 'err');
      return refresh(true);
    }).finally(function(){ btn.disabled = false; });
  };

  // ── meta（工作台地址显示）──
  api('/api/meta').then(function(j){
    if (j && j.ok) {
      S.meta = j;
      var a = $('wbLink');
      a.textContent = j.workbench.replace(/^https?:\/\//, '');
      a.href = j.workbench;
      a.target = '_blank';
      a.rel = 'noopener';
    }
  });

  refresh(false);
  setInterval(function(){ refresh(true); }, 5000);
  setInterval(renderCountdown, 1000);
})();
</script>
</body>
</html>
